name: ModelImage tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/test_core.mjs
      - run: node tests/test_learning.mjs
      - run: node tests/test_world.mjs
      - run: python3 tests/test_web_modules.py
      - run: node tests/test_v3.mjs
      - name: Install real-photograph fixture dependencies
        run: python3 -m pip install --quiet scikit-image pillow numpy
      - name: Prepare disjoint real photographs from skimage gallery
        run: python3 benchmarks/photo_dataset.py
      - name: Evaluate held-out photograph transfer and leakage controls
        run: node tests/test_v3_photos.mjs
